---
device_name: My Battery Controller
env: local
metrics:
  enabled: false
  bind: 0.0.0.0
  port: 5000
remote_control:
  enabled: false
  server_url: wss://localhost:8443/api/agent
  shared_secret: ""
  reconnect:
    initial_seconds: 5
    max_seconds: 60
batteries:
  - name: battery1
    url: https://example.battery1/api
    token: auth-token1
    enabled: true
    capacity_limit: 10000
  - name: battery2
    url: https://example.battery2/api
    token: auth-token2
    enabled: false
    capacity_limit: 5000
  - name: battery3
    url: https://example.battery3/api
    token: auth-token3
    enabled: true
    capacity_limit: 5000
schedules:
  - name: Evening Discharge 1
    start_time: 20:00
    stop_time: 00:00
    battery_name: battery1
    enabled: true
    power_limit: 500
    soc_limit: 50
  - name: Evening Discharge 2
    start_time: 20:00
    stop_time: 00:00
    battery_name: battery2
    enabled: false
    power_limit: 500
    soc_limit: 50
  - name: Evening Discharge 3
    start_time: 20:00
    stop_time: 00:00
    battery_name: battery3
    enabled: true
    power_limit: 500
    soc_limit: 50
charge_schedules:
  - name: Morning Charge 1
    start_time: 06:00
    stop_time: 10:00
    battery_name: battery1
    enabled: false
    power_limit: 1000
    soc_limit: 90