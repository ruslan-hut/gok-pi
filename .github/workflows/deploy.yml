name: Deploy Control Server

on:
  push:
    branches:
      - master

env:
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/ui/package-lock.json

      - name: Install UI dependencies and build
        working-directory: web/ui
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build control server (linux/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p out
          go build -o out/gok-cs ./cmd/controlserver

      - name: Build agent binaries (linux/arm64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p out/downloads
          go build -o out/downloads/gok-pi-agent-linux-arm64 ./cmd/gok
          go build -o out/downloads/gok-agent-updater-linux-arm64 ./cmd/agentupdater

      - name: Prepare deployment bundle
        run: |
          mkdir -p bundle/app/downloads
          cp -r web/ui/dist/. bundle/app/
          cp out/downloads/gok-pi-agent-linux-arm64 bundle/app/downloads/
          cp out/downloads/gok-agent-updater-linux-arm64 bundle/app/downloads/
          cp out/gok-cs bundle/gok-cs
          sha256sum bundle/gok-cs > bundle/SHASUMS
          sha256sum bundle/app/downloads/gok-pi-agent-linux-arm64 >> bundle/SHASUMS
          sha256sum bundle/app/downloads/gok-agent-updater-linux-arm64 >> bundle/SHASUMS
          echo "${GITHUB_SHA}" > bundle/version.txt
          tar -czf release.tar.gz -C bundle .

      - name: Upload bundle to remote host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "release.tar.gz"
          target: "/tmp"

      - name: Generate config file
        run: |
          cat > gok-cs-config.yml <<CFGEOF
          addr: "${{ secrets.CONTROL_ADDR }}"
          secret: "${{ secrets.CONTROL_SECRET }}"
          static: "${DEPLOY_PATH}/current/app"
          agent_binary: "${{ secrets.CONTROL_AGENT_BINARY }}"
          version_file: "VERSION"
          config_store: "/var/lib/gok-cs/agent-configs.json"
          session_db: "/var/lib/gok-cs/sessions.db"
          log_file: "/var/log/gok-cs.log"
          ui_username: "${{ secrets.GOK_UI_USERNAME }}"
          ui_password: "${{ secrets.GOK_UI_PASSWORD }}"
          CFGEOF
          sed -i 's/^          //' gok-cs-config.yml

      - name: Upload config to remote host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "gok-cs-config.yml"
          target: "/tmp"

      - name: Deploy on remote host
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,GITHUB_SHA
          script: |
            set -euo pipefail
            if [ -z "${DEPLOY_PATH}" ]; then
              echo "DEPLOY_PATH secret must be set" >&2
              exit 1
            fi
            RELEASE_DIR="${DEPLOY_PATH}/releases/${GITHUB_SHA}"
            mkdir -p "${RELEASE_DIR}"
            tar -xzf "/tmp/release.tar.gz" -C "${RELEASE_DIR}"

            # Install binary to /usr/local/bin
            install -o root -g root -m 755 "${RELEASE_DIR}/gok-cs" /usr/local/bin/gok-cs

            # Install config file (owner-only read/write, contains secrets)
            mkdir -p /etc/gok-cs
            install -o www-data -g www-data -m 600 /tmp/gok-cs-config.yml /etc/gok-cs/config.yml
            chown www-data:www-data /etc/gok-cs
            chmod 700 /etc/gok-cs

            # Ensure data directory exists with correct ownership
            mkdir -p /var/lib/gok-cs
            chown www-data:www-data /var/lib/gok-cs
            chmod 750 /var/lib/gok-cs

            # Set up static assets
            chown -R www-data:www-data "${RELEASE_DIR}/app"
            find "${RELEASE_DIR}/app" -type d -print0 | xargs -0 chmod 755
            find "${RELEASE_DIR}/app" -type f -print0 | xargs -0 chmod 644
            ln -sfn "${RELEASE_DIR}" "${DEPLOY_PATH}/current"

            # Ensure log file exists and is writable by service user
            touch /var/log/gok-cs.log
            chown www-data:www-data /var/log/gok-cs.log
            chmod 640 /var/log/gok-cs.log

            # Remove old releases, keep 3 most recent
            cd "${DEPLOY_PATH}/releases"
            ls -1t | tail -n +4 | while read -r old; do
              rm -rf "${DEPLOY_PATH}/releases/${old}"
            done

            # Clean up
            rm -f /tmp/release.tar.gz /tmp/gok-cs-config.yml

            if [ -n "${{ secrets.DEPLOY_RESTART_CMD }}" ]; then
              eval "${{ secrets.DEPLOY_RESTART_CMD }}"
            fi

